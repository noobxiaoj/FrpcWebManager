stages:
  - build

variables:
  IMAGE_NAME: noobxiaoj/frpcwebmanager

# ==================== 使用 Kaniko 构建 Docker 镜像 ====================
# 需要在 GitLab CI/CD Variables 中配置以下变量：
# - REGISTRY: 私有 Docker Registry 地址
# - REGISTRY_USER: 私有 Registry 用户名
# - REGISTRY_PASSWORD: 私有 Registry 密码或 Access Token
# - DOCKERHUB_USER: Docker Hub 用户名
# - DOCKERHUB_TOKEN: Docker Hub Access Token (推荐) 或密码

build:image:
  stage: build
  tags:
    - local
  only:
    - tags
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - |
      echo "配置镜像仓库认证..."
      mkdir -p /kaniko/.docker
      # 配置两个 registry 的认证信息
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${REGISTRY}": {
            "username": "${REGISTRY_USER}",
            "password": "${REGISTRY_PASSWORD}"
          },
          "https://index.docker.io/v1/": {
            "username": "${DOCKERHUB_USER}",
            "password": "${DOCKERHUB_TOKEN}"
          }
        }
      }
      EOF

      echo "构建并推送 Docker 镜像到私有仓库和 Docker Hub..."
      /kaniko/executor \
        --dockerfile=Dockerfile \
        --context=. \
        --custom-platform=linux/amd64 \
        --insecure \
        --destination=${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_TAG} \
        --destination=${REGISTRY}/${IMAGE_NAME}:latest \
        --destination=docker.io/${IMAGE_NAME}:${CI_COMMIT_TAG} \
        --destination=docker.io/${IMAGE_NAME}:latest

      echo "镜像推送完成！"