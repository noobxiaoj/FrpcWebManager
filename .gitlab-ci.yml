stages:
  - build

variables:
  IMAGE_TAG: amd64

# ==================== 使用 Kaniko 构建 Docker 镜像 ====================
# 需要在 GitLab CI/CD Variables 中配置以下变量：
# - REGISTRY: Docker Registry 地址
# - IMAGE_NAME: 镜像名称
# - REGISTRY_USER: Registry 用户名
# - REGISTRY_PASSWORD: Registry 密码或 Access Token

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - |
      echo "配置镜像仓库认证..."
      mkdir -p /kaniko/.docker
      echo "{\"auths\":{\"${REGISTRY}\":{\"username\":\"${REGISTRY_USER}\",\"password\":\"${REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json

      echo "构建并推送 Docker 镜像..."
      /kaniko/executor \
        --dockerfile=Dockerfile \
        --context=. \
        --custom-platform=linux/amd64 \
        --insecure \
        --destination=${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}

      echo "镜像推送完成"
  only:
    - master
    - main
    - tags
